main: net.tfminecraft.tfmccore.TFMCCore
api-version: 1.21
name: TFMCCore
version: 1.0
author: Drefvelin

depend: [TLibs]
softdepend: [VehicleFramework, RPCharacters, AdvancedCrafting, MythicLib, MMOCore, SimpleFactions]

commands:
  core:
    description: TFMC Core command
    usage: /core reload [all|config|drops|stations|stats|focus|whistle|letters|lorestones] | /core stats <category> [player] | /core focus restore <player> | /core stones give <lorestone|namestone> [player] [amount]
    aliases: [tfmc]

permissions:
  tfmccore.admin:
    description: View other players' stats and server-wide totals
    default: op
  tfmccore.reload:
    description: Reload TFMCCore configs
    default: op
  tfmccore.stones.use:
    description: Use lorestones and namestones on items
    default: true
